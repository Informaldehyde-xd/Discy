# Project-wide Gradle settings.

# JVM options for the Gradle daemon (allocates memory for faster builds)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enables AndroidX packages
android.useAndroidX=true

# Enforces official Kotlin code formatting style
kotlin.code.style=official

# Enables non-transitive R classes to significantly speed up build times
android.nonTransitiveRClass=true

# Parallel build execution across modules
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true
